services:
  - type: web
    name: omnivue-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run api:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8787
      - key: REQUIRE_AI_KEY
        value: "true"
      - key: AI_PROVIDER
        value: auto
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        sync: false
